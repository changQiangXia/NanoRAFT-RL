name: nanoraft-rl
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  # Python版本
  - python=3.10
  
  # PyTorch (GPU版本 - CUDA 12.1)
  - pytorch>=2.1.0
  - torchvision>=0.16.0
  - torchaudio>=2.1.0
  - pytorch-cuda=12.1
  
  # 基础科学计算
  - numpy>=1.24.0
  - pandas>=2.0.0
  - pyyaml>=6.0.1
  - tqdm>=4.66.0
  - python-dotenv>=1.0.0
  
  # 文档处理
  - beautifulsoup4>=4.12.0
  
  # 工具
  - pip
  - pip:
    # Transformers生态 (conda中版本较旧，使用pip安装最新版)
    - transformers>=4.36.0
    - peft>=0.7.1
    - bitsandbytes>=0.41.0
    - accelerate>=0.25.0
    - datasets>=2.14.0
    
    # LangChain & LlamaIndex
    - llama-index>=0.9.0
    - langchain>=0.0.350
    - langchain-openai>=0.0.2
    - langchain-community>=0.0.2
    
    # 向量数据库与Embedding
    - chromadb>=0.4.18
    - sentence-transformers>=2.2.2
    - faiss-cpu>=1.7.4
    
    # 强化学习
    - trl>=0.7.4
    - wandb>=0.16.0
    
    # 评估
    - ragas>=0.0.22
    - scikit-learn>=1.3.0
    - nltk>=3.8.1
    
    # 文档处理补充
    - pypdf>=3.17.0
    - python-docx>=1.1.0
    - markdown>=3.5.0
    
    # 类型检查
    - pydantic>=2.0.0
    
    # 国产大模型API
    - zhipuai>=2.0.0  # 智谱AI
