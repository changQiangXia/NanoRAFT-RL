# PPO强化学习配置文件 - Reproduction快速完成版
# 目标：在单卡4090上稳定跑通完整PPO流程并产出可评估模型

model:
  sft_model_path: "outputs/raft-sft/final"
  base_model: "Qwen/Qwen2-7B-Instruct"
  trust_remote_code: true

ppo:
  learning_rate: 1.0e-5
  batch_size: 2
  mini_batch_size: 1
  gradient_accumulation_steps: 2

  ppo_epochs: 2
  clip_range: 0.2
  clip_range_value: 0.2
  gamma: 0.99
  lam: 0.95

  max_new_tokens: 96
  temperature: 0.8
  top_p: 0.9

  total_steps: 60
  logging_steps: 1
  save_steps: 20

reward:
  components:
    citation_accuracy:
      weight: 1.0
      description: "奖励准确引用context的answer"
    format_compliance:
      weight: 0.5
      description: "奖励符合CoT格式"
    hallucination_penalty:
      weight: -1.0
      description: "惩罚与context矛盾的内容"
    context_usage:
      weight: 0.3
      description: "奖励使用提供的context"
  use_ragas: false
  reward_model_path: null

data:
  train_file: "data/synthetic/train.jsonl"
  val_file: "data/synthetic/val.jsonl"
  max_samples: 200
  max_seq_length: 768

memory:
  load_in_4bit: true
  reward_model_on_cpu: true
  ref_model_4bit: true
  empty_cache_freq: 10

output:
  output_dir: "outputs/raft-ppo"
  save_merged_model: true

evaluation:
  eval_freq: 20
  eval_samples: 30
