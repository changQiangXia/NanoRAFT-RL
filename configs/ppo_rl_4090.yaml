# PPO强化学习配置文件 - RTX 4090版
# 24GB VRAM支持完整的PPO训练

# ============================================================
# 1. 基础模型配置
# ============================================================
model:
  # 使用SFT后的模型作为起点
  sft_model_path: "outputs/raft-sft/final"  # 使用刚才训练的SFT模型
  
  # 或从HuggingFace加载
  base_model: "Qwen/Qwen2-7B-Instruct"  # 基座模型（本地已缓存）
  
  trust_remote_code: true

# ============================================================
# 2. PPO训练配置
# ============================================================
ppo:
  # PPO超参数
  learning_rate: 1.0e-5
  batch_size: 4                # 保守设置，避免OOM
  mini_batch_size: 1            # 必须保持为1
  gradient_accumulation_steps: 4  # 4/4=1 ✅
  
  ppo_epochs: 4                 # 每个batch的PPO迭代次数
  clip_range: 0.2               # PPO剪切范围
  clip_range_value: 0.2
  gamma: 0.99                   # 折扣因子
  lam: 0.95                     # GAE lambda
  
  # 生成配置
  max_new_tokens: 128           # 【极限】从256降到128，数学上384*151936*4≈222MB
  temperature: 0.8
  top_p: 0.9
  
  # 训练步数
  total_steps: 1000
  logging_steps: 10
  save_steps: 100

# ============================================================
# 3. 奖励模型配置
# ============================================================
reward:
  # 奖励组成权重
  components:
    citation_accuracy:          # 引用准确性（核心）
      weight: 1.0
      description: "奖励准确引用context的answer"
    
    format_compliance:          # 格式合规性
      weight: 0.5
      description: "奖励符合CoT格式"
    
    hallucination_penalty:      # 幻觉惩罚
      weight: -1.0
      description: "惩罚与context矛盾的内容"
    
    context_usage:              # Context使用度
      weight: 0.3
      description: "奖励使用提供的context"
  
  # 可选：使用RAGAS作为奖励信号
  use_ragas: false              # 可以启用，但较慢
  
  # 可选：加载预训练奖励模型
  reward_model_path: null       # 如果有训练的奖励模型

# ============================================================
# 4. 数据配置
# ============================================================
data:
  # 使用合成数据训练
  train_file: "data/synthetic/train.jsonl"
  val_file: "data/synthetic/val.jsonl"
  
  max_samples: 500              # PPO训练样本数（不需要太多）
  max_seq_length: 1024          # 【关键】从2048降到1024

# ============================================================
# 5. 显存优化配置（4090有余量，可以宽松些）
# ============================================================
memory:
  # 模型量化（Policy和Reference可以共存）
  load_in_4bit: true
  
  # 奖励模型放在CPU（节省显存给Policy）
  reward_model_on_cpu: true
  
  # 参考模型使用4-bit（与Policy共存）
  ref_model_4bit: true
  
  # 显存清理频率
  empty_cache_freq: 25

# ============================================================
# 6. 输出配置
# ============================================================
output:
  output_dir: "outputs/raft-ppo"
  save_merged_model: true       # 保存合并后的模型

# ============================================================
# 7. 评估配置
# ============================================================
evaluation:
  eval_freq: 100                # 每100步评估
  eval_samples: 50              # 评估样本数
