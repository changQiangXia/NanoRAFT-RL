# RAFT (Retrieval-Augmented Fine-Tuning) 配置文件 - RTX 4090优化版
# 24GB VRAM极致性能配置

# ============================================================
# 1. 数据配置
# ============================================================
data:
  train_file: "data/synthetic/train.jsonl"
  val_file: "data/synthetic/val.jsonl"
  
  max_seq_length: 2048       # 从1024提升到2048（翻倍）
  padding_side: "right"

# ============================================================
# 2. 模型配置 - 7B级别模型
# ============================================================
model:
  # 推荐：Qwen2-7B（中文强）或 Llama-2-7B（英文强）
  base_model: "Qwen/Qwen2-7B-Instruct"
  
  # 或尝试13B模型（需要4-bit量化）
  # base_model: "Qwen/Qwen2-14B-Instruct"
  
  trust_remote_code: true

# ============================================================
# 3. QLoRA配置（完整启用）
# ============================================================
qlora:
  enabled: true              # 启用4-bit量化！
  load_in_4bit: true
  bnb_4bit_quant_type: "nf4"
  bnb_4bit_compute_dtype: "bfloat16"  # 4090原生支持bf16
  bnb_4bit_use_double_quant: true      # 嵌套量化

# ============================================================
# 4. LoRA配置 - 大幅提升秩
# ============================================================
lora:
  r: 64                      # 从8提升到64（8倍参数量）
  alpha: 128                 # 相应提升
  
  # 更多目标模块（全量微调LoRA版）
  target_modules: 
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"
  
  dropout: 0.05
  bias: "none"
  task_type: "CAUSAL_LM"

# ============================================================
# 5. 训练配置 - 大幅提升
# ============================================================
training:
  output_dir: "outputs/raft-sft-4090"
  
  num_epochs: 5              # 从3提升到5
  
  # Batch Size大幅提升
  per_device_train_batch_size: 4       # 从1提升到4
  per_device_eval_batch_size: 4
  gradient_accumulation_steps: 4        # 有效batch=16
  
  # 学习率调整（更大batch需要稍大lr）
  learning_rate: 5.0e-4      # 从2e-4提升
  
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.03
  
  # 分页优化器节省显存
  optim: "paged_adamw_8bit"  # 启用！
  
  weight_decay: 0.001
  max_grad_norm: 0.3
  
  # 梯度检查点（仍然启用以支持更大模型）
  gradient_checkpointing: true
  
  # 日志和保存
  logging_steps: 10
  save_steps: 100
  eval_steps: 100
  save_total_limit: 3
  
  evaluation_strategy: "steps"
  load_best_model_at_end: true
  metric_for_best_model: "eval_loss"
  
  # 4090完美支持bf16
  fp16: false
  bf16: true                 # 启用bf16！
  
  report_to: "tensorboard"   # 可以启用tensorboard了

# ============================================================
# 6. RAFT特殊配置
# ============================================================
raft:
  include_context: true
  cot_marker: "$Chain-of-Thought$"
  response_template: "### Response:\n"

# ============================================================
# 7. 显存监控（调试用途）
# ============================================================
memory:
  monitor: true
  empty_cache_freq: 50       # 可以降低频率
  max_memory: {0: "22GiB"}   # 使用22GB，留2GB余量
